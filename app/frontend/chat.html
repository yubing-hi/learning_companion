<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能学伴 · 课程答疑</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="chat">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark">LA</div>
        <div>
          <div class="brand-title">智能学伴</div>
          <p class="brand-subtitle">课程答疑</p>
        </div>
      </div>
      <nav class="nav-tabs" aria-label="主导航">
        <a class="nav-tabs__link" href="./index.html">总览</a>
        <a class="nav-tabs__link is-active" href="./chat.html">答疑</a>
        <a class="nav-tabs__link" href="./practice.html">练习</a>
        <a class="nav-tabs__link" href="./plan.html">计划</a>
        <a class="nav-tabs__link" href="./profile.html">画像</a>
      </nav>
      <div class="status-cluster">
        <div class="pill pill--soft">
          <span class="status-dot" data-health-dot></span>
          <span data-health-label>正在检查后端</span>
        </div>
        <div class="pill">
          当前学生
          <strong data-active-student>未绑定</strong>
        </div>
      </div>
    </header>

    <main class="page-stack">
      <section class="section-band section-band--compact">
        <form class="surface-inline" data-form="student-switch">
          <label class="field field--inline">
            <span>学生 ID</span>
            <input type="text" name="student_id" data-student-input placeholder="例如 stu_001">
          </label>
          <button class="button button--secondary" type="submit">切换学生</button>
          <button class="button button--ghost" type="button" data-action="load-profile">读取画像</button>
        </form>
      </section>

      <section class="section-band">
        <div class="two-column-layout two-column-layout--wide">
          <aside class="surface-block">
            <h2>发起答疑</h2>
            <p class="helper-text">学生画像加载后，问题会和知识点诊断一起联动。</p>
            <div class="prompt-list">
              <button class="prompt-chip" type="button" data-chat-prompt="什么是栈，它和队列有什么区别？">栈和队列的区别</button>
              <button class="prompt-chip" type="button" data-chat-prompt="二叉树的前序、中序、后序遍历分别是什么？">二叉树遍历</button>
              <button class="prompt-chip" type="button" data-chat-prompt="图的深度优先搜索和广度优先搜索有什么不同？">图搜索方法</button>
            </div>
            <form data-form="chat">
              <label class="field">
                <span>问题内容</span>
                <textarea name="message" rows="8" data-chat-input placeholder="请输入想问的问题"></textarea>
              </label>
              <button class="button button--primary" type="submit">发送提问</button>
            </form>
          </aside>

          <section class="surface-block surface-block--chat">
            <div class="section-heading section-heading--tight">
              <div>
                <h2>对话记录</h2>
                <p>会保留最近的问答记录，切页后也不会丢。</p>
              </div>
              <button class="button button--ghost" type="button" data-action="clear-chat">清空记录</button>
            </div>
            <div id="chatTimeline" class="chat-timeline">
              <div class="empty-panel">
                <p>还没有对话。你可以从左侧选择提示问题，或者直接输入新的问题。</p>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
